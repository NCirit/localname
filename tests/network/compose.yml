services:
  router:
    build:
      context: ../..
      target: network-test
    command: ["--config", "/etc/localname/config.toml", "serve"]
    volumes:
      - ./router.toml:/etc/localname/config.toml:ro
    networks:
      lan:
        ipv4_address: 10.53.0.1
    read_only: true
    tmpfs:
      - /etc/localname:uid=10001,gid=10001
  server:
    build:
      context: ../..
      target: network-test
    command: ["--config", "/etc/localname/config.toml", "serve"]
    volumes:
      - ./server.toml:/etc/localname/config.toml:ro
    networks:
      lan:
        ipv4_address: 10.53.0.2
    read_only: true
    tmpfs:
      - /etc/localname:uid=10001,gid=10001
  upstream:
    build:
      context: ../..
      target: network-test
    command: ["--config", "/etc/localname/config.toml", "serve"]
    volumes:
      - ./upstream.toml:/etc/localname/config.toml:ro
    networks:
      lan:
        ipv4_address: 10.53.0.3
    read_only: true
    tmpfs:
      - /etc/localname:uid=10001,gid=10001
  privileged:
    # Starts as root with only the capabilities needed to bind port 53 and switch user.
    # Healthy only when the daemon (PID 1) runs as the unprivileged localname account.
    build:
      context: ../..
      target: network-test
    user: "0"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cp /fixture/config.toml /etc/localname/config.toml
        chown 10001:10001 /etc/localname/config.toml
        exec localname --config /etc/localname/config.toml serve --user localname
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          u=$$(id -u localname); g=$$(id -g localname);
          [ "$$(awk '/^Uid:/ {print $$2, $$3, $$4, $$5}' /proc/1/status)" = "$$u $$u $$u $$u" ] &&
          [ "$$(awk '/^Gid:/ {print $$2, $$3, $$4, $$5}' /proc/1/status)" = "$$g $$g $$g $$g" ] &&
          [ "$$u" != 0 ] && [ "$$g" != 0 ]
      interval: 1s
      retries: 30
    volumes:
      - ./privileged.toml:/fixture/config.toml:ro
    read_only: true
    tmpfs:
      - /etc/localname:uid=10001,gid=10001
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN]
    security_opt: [no-new-privileges:true]
    networks:
      lan:
        ipv4_address: 10.53.0.4
  client:
    build:
      context: ../..
      target: network-test
    entrypoint: ["network-probe"]
    environment:
      LOCALNAME_TEST_SERVER: 10.53.0.1:5354
      LOCALNAME_TEST_BOOTSTRAP: 10.53.0.10:5354
      LOCALNAME_TEST_PRIVILEGED: 10.53.0.4:53
    depends_on:
      router: {condition: service_started}
      server: {condition: service_started}
      upstream: {condition: service_started}
      bootstrap: {condition: service_started}
      privileged: {condition: service_healthy}
    networks: [lan]
  bootstrap:
    build:
      context: ../..
      target: network-test
    entrypoint: ["/bin/sh", "/usr/local/bin/container-entrypoint"]
    environment:
      LOCALNAME_LISTEN: 10.53.0.10:5354
      LOCALNAME_ADVERTISE_ADDRESS: 192.168.1.10
    volumes:
      - bootstrap_state:/var/lib/localname
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks:
      lan:
        ipv4_address: 10.53.0.10
networks:
  lan:
    internal: true
    ipam:
      config:
        - subnet: 10.53.0.0/24
          gateway: 10.53.0.254
volumes:
  bootstrap_state:
