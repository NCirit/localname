[package]
name = "localname"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Fast, safe, friendly names for local networks"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0"
arc-swap = "1.7"
clap = { version = "4.6", features = ["derive", "env"] }
dirs = "6.0"
fs2 = "0.4"
hickory-proto = "0.26"
ipnet = { version = "2.11", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
proptest = "1.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
must_use_candidate = "allow"

