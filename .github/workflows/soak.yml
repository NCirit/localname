name: Soak
# Sustained reliability: 30 minutes of mixed load every night on both architectures.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin localname --example soak
      - run: target/release/examples/soak | tee "soak-${{ runner.arch }}.json"
        env:
          LOCALNAME_SOAK_SECONDS: "1800"
          LOCALNAME_SOAK_BUDGET: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ runner.arch }}
          path: soak-*.json
