name: CI
# Fast gate, manual only (Actions > CI > Run workflow); release.yml also calls it. One cached
# Linux job on the MSRV toolchain, with macOS and Windows type checks by cross-target clippy.
# Heavier suites (Docker, packages, real macOS/Windows hosts) are in integration.yml.
on: [workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      # Decision 10: a DNS-only build has no HTTP or TLS dependencies.
      - run: "! cargo tree --locked --no-default-features -e normal | grep -E 'hyper|http-body|rustls|ring'"
      - run: cargo clippy --locked --no-default-features --lib -- -D warnings
      # Without the TLS stack the other targets need no C cross-compiler.
      - run: cargo clippy --locked --no-default-features --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo clippy --locked --no-default-features --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: pip install --quiet PyYAML && python3 scripts/validate_skill.py
