name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --locked --all-targets
  agent-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML
      - run: python scripts/validate_skill.py
  network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p localname-test -f tests/network/compose.yml up --build --abort-on-container-exit --exit-code-from client
      - if: always()
        run: docker compose -p localname-test -f tests/network/compose.yml down --volumes
  whole-home-setup:
    # A second device takes a DHCP lease from a router that applies only the plan's router
    # action, then verifies UDP, TCP, and system-resolver resolution (M3a).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p localname-setup -f tests/network/setup.yml up --build --abort-on-container-exit --exit-code-from client
      - if: always()
        run: docker compose -p localname-setup -f tests/network/setup.yml down --volumes
  benchmark:
    # Performance budgets (see README): local answers p99 <= 5 ms at a paced 10k queries/s
    # with 10k records, server RSS <= 64 MiB, release binary <= 10 MiB, zero errors.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --bin localname --example benchmark
      - name: Binary size budget
        run: test "$(stat -c %s target/release/localname)" -le 10485760
      - name: Latency and memory budget
        env:
          LOCALNAME_BENCH_BUDGET_P99_MS: "5"
          LOCALNAME_BENCH_BUDGET_RSS_MB: "64"
        run: target/release/examples/benchmark | tee "benchmark-${{ runner.arch }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ runner.arch }}
          path: benchmark-*.json
  systemd:
    # Boots the packaged unit under systemd, mutates it live and offline, and restarts the
    # container to check that the enabled service returns with the committed revision.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tests/systemd/run.sh
