name: Release
# Manual only: push a tag vX.Y.Z, then run this workflow with "Use workflow from" set to
# that tag. The tag sets the version (packaging/set-version.sh). It runs the CI gate, builds
# archives for Linux, macOS, and Windows plus .deb/.rpm packages, and publishes them with
# SHA256SUMS and a build-provenance attestation (`gh attestation verify FILE --repo
# OWNER/localname`).
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported runners keep the glibc requirement low.
          - {os: ubuntu-22.04, targets: x86_64-unknown-linux-gnu, arch: x86_64, packages: true}
          - {os: ubuntu-22.04-arm, targets: aarch64-unknown-linux-gnu, arch: aarch64, packages: true}
          # One macOS runner builds both architectures.
          - {os: macos-14, targets: 'aarch64-apple-darwin,x86_64-apple-darwin'}
          - {os: windows-2022, targets: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
      - name: Set the version from the tag
        shell: bash
        run: packaging/set-version.sh "${GITHUB_REF_NAME#v}"
      - name: Build and archive
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          set -eu
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist
          for target in ${TARGETS//,/ }; do
            cargo build --locked --release --target "$target" --bin localname
            name=localname-$version-$target
            mkdir -p "$name"
            binary=target/$target/release/localname
            [ -f "$binary.exe" ] && binary=$binary.exe
            cp "$binary" README.md "$name/"
            cp -r skills packaging/systemd "$name/"
            if [ "${{ runner.os }}" = Windows ]; then
              7z a -tzip "dist/$name.zip" "$name" >/dev/null
            else
              tar -czf "dist/$name.tar.gz" "$name"
            fi
          done
      - name: Linux packages
        if: matrix.packages
        run: |
          sudo apt-get update -q >/dev/null && sudo apt-get install -y -q rpm >/dev/null
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) packaging/build-packages.sh "${GITHUB_REF_NAME#v}" ${{ matrix.arch }} target/${{ matrix.targets }}/release/localname dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "localname ${GITHUB_REF_NAME#v}" --generate-notes dist/*
